title: Joint_Variant_Call_hsa
about: Config file for references and modules

# scratch_base   : job scratch = <scratch_base>/<user PRIMARY group>/<user>/job_<id>
#                  (S01-03 launcher; node-independent, no supplementary-group traversal)
# scratch_root    : fixed scratch tree for S04 / supp scripts (legacy; still group-pinned)
# sbatch_exclude  : comma-separated nodes to keep jobs off (broken mounts etc.); "" = none
# min_free_gb     : S01-03 launcher aborts if the output filesystem has less free; 0 = no check

remote:
  ref_gnm: "/mnt/data/amedina/esalazarf/References/hg38/hg38.fa"
  ref_vars: "/mnt/data/amedina/esalazarf/References/dbsnp157/dbSNP157.canon_chr.vcf.gz"
  ref_panel: "/mnt/data/fsanchezq/esalazarf/References/hg38/H1K2/current_release"
  ref_gmap: "/mnt/data/fsanchezq/esalazarf/References/hg38/genetic_maps.b38"
  scratch_base: "/scratch/groups"
  scratch_root: "/scratch/groups/amedina"
  sbatch_exclude: "node09"
  min_free_gb: "2000"
  modules: "gatk samtools mosdepth r/4.4.1"

local:
  ref_gnm: "$HOME/Data/REFx/hg38.p14/hg38.fa.gz"
  ref_vars: "$HOME/Data/REFx/dbSNP157/dbSNP157.canon_chr.vcf.gz"
  ref_panel: "$HOME/Data/HGDP+1KGP.v2/current_release"
  ref_gmap: "$HOME/Data/REFx/EDIT_THIS/genetic_maps.b38"
  scratch_base: ""
  scratch_root: ""
  sbatch_exclude: ""
  min_free_gb: "0"
  modules: ""
